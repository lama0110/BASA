[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffsynth-wan"
dynamic = ["version"]
description = "Wan-only extraction of ModelScope DiffSynth-Studio"
readme = "README.md"
authors = [{name = "ModelScope Team"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10.1"
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "transformers",
    "imageio[ffmpeg]",
    "safetensors",
    "einops",
    "modelscope",
    "huggingface_hub",
    "ftfy",
    "regex",
    "pandas",
    "accelerate",
    "peft",
    "tqdm",
    "Pillow",
    "typing_extensions",
]

[project.optional-dependencies]
audio = ["av", "torchaudio", "torchcodec", "librosa"]
quant = ["bitsandbytes", "comfy-kitchen", "torchao>=0.16"]
training = ["deepspeed"]
logger = ["tensorboard", "swanlab", "wandb"]
npu = ["torch==2.7.1+cpu", "torch-npu==2.7.1", "torchvision==0.22.1+cpu"]
npu_aarch64 = ["torch==2.7.1", "torch-npu==2.7.1", "torchvision==0.22.1"]
controlnet = ["controlnet_aux"]
all = [
    "av", "torchaudio", "torchcodec", "librosa",
    "bitsandbytes", "comfy-kitchen", "torchao>=0.16",
    "deepspeed", "tensorboard", "swanlab", "wandb", "controlnet_aux"
]

[tool.setuptools.packages.find]
where = ["./"]
include = ["diffsynth", "diffsynth.*"]

[tool.setuptools.dynamic]
version = {attr = "diffsynth.version.__version__"}

[tool.setuptools]
include-package-data = true
